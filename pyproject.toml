[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "src-qmnist-case-study"
version = "0.1.0"
description = "Executable QMNIST case study for Scoped Reproducibility Claims"
readme = "README.md"
requires-python = "==3.12.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Casper Marc Sluitman", email = "Casper.Sluitman@gmail.com" },
  { name = "Shahrol Mohammadan", email = "mshahrol@shibaura-it.ac.jp" },
]
dependencies = [
  "numpy==2.4.6",
  "onnxruntime==1.28.0",
  "pillow==12.0.0",
  "rocrate==0.15.1",
]

[project.optional-dependencies]
audit = [
  "roc-validator==0.11.2",
  "runcrate==0.6.2",
]

[project.scripts]
src-case = "repro_case.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["repro_case"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
