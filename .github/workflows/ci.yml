name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12.10
          cache: pip
      - name: Install the locked runtime
        run: python -m pip install .
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check every Python module compiles
        run: python -m compileall -q repro_case tests

  container-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build the analysis layer
        run: docker build --platform linux/amd64 --target analysis -t src-qmnist:check .
      - name: Test inside the image
        run: docker run --rm --entrypoint python src-qmnist:check -m unittest discover -s tests -v
